<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>zenlite — relaunching soon</title>
<meta name="description" content="zenlite is being rebuilt: AI, from the architect's chair.">
<meta name="robots" content="noindex">
<style>
  :root { --bg:#f7f7f5; --fg:#16181d; --muted:#5d6370; --accent:#2f6fde; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --fg:#e8eaee; --muted:#9aa1ad; --accent:#7aa7ff; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
         background:var(--bg); color:var(--fg);
         font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:560px; }
  .mark { font-weight:700; letter-spacing:.02em; font-size:20px; }
  .mark span { color:var(--accent); }
  h1 { font-size:clamp(28px,6vw,40px); line-height:1.15; margin:28px 0 12px; }
  p { color:var(--muted); margin:0 0 12px; }
</style>
</head>
<body>
<main>
  <div class="mark">zen<span>lite</span></div>
  <h1>AI, from the architect's chair.</h1>
  <p>We're rebuilding zenlite as a place to understand AI tools deeply, test what they produce, and build with them like an architect.</p>
  <p>Relaunching soon.</p>
</main>
</body>
